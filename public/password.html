<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>變更密碼・假日加班登記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="page" style="max-width:460px;padding-top:3rem;">
  <div class="card">
    <h2 id="title">變更密碼</h2>
    <p class="hint" id="subtitle">請設定一組只有你知道的密碼。</p>
    <div id="msg"></div>
    <form id="pwForm">
      <div class="field" id="oldField">
        <label for="oldPw">目前密碼</label>
        <input type="password" id="oldPw" autocomplete="current-password">
      </div>
      <div class="field">
        <label for="newPw">新密碼（至少 8 字，混用兩種以上字元）</label>
        <input type="password" id="newPw" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="newPw2">再輸入一次新密碼</label>
        <input type="password" id="newPw2" autocomplete="new-password" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
          儲存新密碼</button>
      </div>
    </form>
  </div>
  <footer><a href="/">← 回加班登記</a></footer>
</div>

<script src="/static/js/common.js"></script>
<script>
  let forced = false;

  (async () => {
    const me = await App.api('/api/me');
    App.me = me;
    App.csrf = me.csrf;
    forced = me.user.must_change_password;
    if (forced) {
      document.getElementById('title').textContent = '請先設定新密碼';
      document.getElementById('subtitle').textContent =
        '這是初始密碼，為了安全請先改成只有你知道的密碼，之後才能使用系統。';
      document.getElementById('oldField').hidden = true;
      document.querySelector('footer').hidden = true;
    }
  })();

  document.getElementById('pwForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');
    const newPw = document.getElementById('newPw').value;
    if (newPw !== document.getElementById('newPw2').value) {
      msg.innerHTML = '<div class="alert alert-error">兩次輸入的新密碼不一樣</div>';
      return;
    }
    btn.disabled = true;
    try {
      await App.api('/api/change-password', {
        body: { old_password: document.getElementById('oldPw').value, new_password: newPw },
      });
      msg.innerHTML = '<div class="alert alert-ok">密碼已更新，正在進入系統…</div>';
      setTimeout(() => { location.href = '/'; }, 900);
    } catch (err) {
      msg.innerHTML = '<div class="alert alert-error">' + App.esc(err.message) + '</div>';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
