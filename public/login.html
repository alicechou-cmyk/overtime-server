<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入・假日加班登記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
<style>
  .login-page{max-width:420px;margin:0 auto;padding:4rem 1.25rem;}
  .login-head{text-align:center;margin-bottom:2rem;}
  .login-head .eyebrow{font-size:.78rem;letter-spacing:.14em;color:var(--amber);
    text-transform:uppercase;font-weight:600;margin-bottom:.7rem;}
  .login-head h1{font-size:1.5rem;margin:0 0 .5rem;}
  .login-head p{color:var(--slate);font-size:.9rem;margin:0;}
  .login-clock{font-family:'JetBrains Mono',monospace;font-size:2.2rem;font-weight:600;
    letter-spacing:.02em;text-shadow:0 0 26px var(--amber-soft);margin-bottom:.3rem;}
</style>
</head>
<body>
<div class="login-page">
  <div class="login-head">
    <div class="eyebrow">假日加班・即時登記</div>
    <div class="login-clock mono" id="clock">--:--:--</div>
    <p id="dateLine">—</p>
  </div>

  <!-- 第一次啟用：建立管理員 -->
  <div class="card" id="setupCard" hidden>
    <h2>初次設定</h2>
    <p class="hint">這是第一次啟用，請先建立你的管理員帳號。
      設定完成後就可以進後台新增員工。</p>
    <div id="setupMsg"></div>
    <form id="setupForm">
      <div class="field">
        <label for="setupCompany">公司名稱</label>
        <input type="text" id="setupCompany" placeholder="玩美行動">
      </div>
      <div class="field">
        <label for="setupName">你的姓名</label>
        <input type="text" id="setupName" placeholder="王小明">
      </div>
      <div class="field">
        <label for="setupEmail">你的 Email</label>
        <input type="text" id="setupEmail" placeholder="you@company.com">
      </div>
      <div class="field">
        <label for="setupPw">設定管理員密碼（至少 8 字，混用兩種以上字元）</label>
        <input type="password" id="setupPw" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="setupPw2">再輸入一次密碼</label>
        <input type="password" id="setupPw2" autocomplete="new-password" required>
      </div>
      <p class="hint" style="margin:0 0 .8rem;">登入帳號固定是 <b>admin</b>，
        密碼就是你上面設定的這一組。</p>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block" id="setupBtn">
          建立管理員帳號並開始使用</button>
      </div>
    </form>
  </div>

  <div class="card" id="loginCard" hidden>
    <h2>登入</h2>
    <p class="hint">請用公司配發的帳號登入。忘記密碼請找管理員重設。</p>
    <div id="msg"></div>
    <form id="loginForm">
      <div class="field">
        <label for="account">帳號</label>
        <input type="text" id="account" autocomplete="username" autocapitalize="off"
               spellcheck="false" required autofocus>
      </div>
      <div class="field">
        <label for="password">密碼</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">登入</button>
      </div>
    </form>
  </div>

  <footer>加完班馬上登記，系統立刻蓋上時間戳、同步通知主管與 HR。<br>有紀錄，才有加班費。</footer>
</div>

<script src="/static/js/common.js"></script>
<script>
  function tick() {
    const now = new Date();
    document.getElementById('clock').textContent =
      App.pad(now.getHours()) + ':' + App.pad(now.getMinutes()) + ':' + App.pad(now.getSeconds());
    document.getElementById('dateLine').textContent =
      now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日（週' +
      App.WD[now.getDay()] + '）';
  }
  tick();
  setInterval(tick, 1000);

  // 沒有任何帳號 → 顯示初次設定；否則顯示登入
  (async () => {
    try {
      const s = await App.api('/api/setup-status', { noRedirect: true });
      document.getElementById(s.needs_setup ? 'setupCard' : 'loginCard').hidden = false;
      if (s.needs_setup) {
        document.getElementById('setupCompany').value = s.company_name || '';
        document.getElementById('setupCompany').focus();
      } else {
        document.getElementById('account').focus();
      }
    } catch (err) {
      document.getElementById('loginCard').hidden = false;
      document.getElementById('msg').innerHTML =
        '<div class="alert alert-error">' + App.esc(err.message) + '</div>';
    }
  })();

  document.getElementById('setupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('setupMsg');
    const btn = document.getElementById('setupBtn');
    const pw = document.getElementById('setupPw').value;
    if (pw !== document.getElementById('setupPw2').value) {
      msg.innerHTML = '<div class="alert alert-error">兩次輸入的密碼不一樣</div>';
      return;
    }
    btn.disabled = true;
    btn.textContent = '建立中…';
    try {
      await App.api('/api/setup', {
        body: {
          password: pw,
          name: document.getElementById('setupName').value.trim(),
          email: document.getElementById('setupEmail').value.trim(),
          company_name: document.getElementById('setupCompany').value.trim(),
        },
        noRedirect: true,
      });
      msg.innerHTML = '<div class="alert alert-ok">建立完成，正在進入系統…</div>';
      setTimeout(() => { location.href = '/admin'; }, 900);
    } catch (err) {
      msg.innerHTML = '<div class="alert alert-error">' + App.esc(err.message) + '</div>';
      btn.disabled = false;
      btn.textContent = '建立管理員帳號並開始使用';
    }
  });

  function nextUrl() {
    const raw = new URLSearchParams(location.search).get('next') || '/';
    // 只接受站內相對路徑，避免被導到外部網站
    return (raw.startsWith('/') && !raw.startsWith('//')) ? raw : '/';
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    btn.textContent = '登入中…';
    msg.innerHTML = '';
    try {
      const res = await App.api('/api/login', {
        body: {
          account: document.getElementById('account').value.trim(),
          password: document.getElementById('password').value,
        },
        noRedirect: true,
      });
      location.href = res.user.must_change_password ? '/password' : nextUrl();
    } catch (err) {
      msg.innerHTML = '<div class="alert alert-error">' + App.esc(err.message) + '</div>';
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
      btn.disabled = false;
      btn.textContent = '登入';
    }
  });
</script>
</body>
</html>
